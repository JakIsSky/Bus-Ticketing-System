<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Bus Ticketing System</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="supabase-db.js"></script>
    <script src="auth.js"></script>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <div class="logo-icon">🚌</div>
                <h1>Bus Ticketing System</h1>
                <p id="loginSubtitle">Sign in with an active staff or admin account</p>
            </div>

            <div class="auth-tabs">
                <button type="button" class="auth-tab active" id="tabLogin">Sign In</button>
                <button type="button" class="auth-tab" id="tabSignup">Create Account</button>
            </div>

            <div id="loginError" class="login-error" style="display:none"></div>
            <div id="loginNotice" class="login-notice"></div>

            <!-- SIGN IN -->
            <form id="loginForm">
                <div class="form-grid" style="grid-template-columns: 1fr;">
                    <div class="form-group">
                        <label for="username">Username or Email</label>
                        <input type="text" id="username" placeholder="Enter username or email" required autocomplete="username">
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="Enter password" required autocomplete="current-password">
                    </div>
                </div>

                <button type="submit" class="save-btn submit-full" id="loginBtn">Sign In</button>
            </form>

            <!-- CREATE ACCOUNT -->
            <form id="signupForm" class="hidden-form">
                <div class="form-grid" style="grid-template-columns: 1fr;">
                    <div class="form-group">
                        <label for="suFullName">Full Name</label>
                        <input type="text" id="suFullName" placeholder="Juan Dela Cruz" maxlength="100" autocomplete="name">
                    </div>

                    <div class="form-group">
                        <label for="suUsername">Username</label>
                        <input type="text" id="suUsername" placeholder="3–30 letters, numbers, . or _" required maxlength="30" autocomplete="username">
                    </div>

                    <div class="form-group">
                        <label for="suEmail">Email</label>
                        <input type="email" id="suEmail" placeholder="name@example.com" required maxlength="100" autocomplete="email">
                    </div>

                    <div class="form-group">
                        <label for="suPassword">Password</label>
                        <input type="password" id="suPassword" placeholder="Create a password" required autocomplete="new-password">
                        <ul class="pw-rules" id="pwRules">
                            <li data-rule="len">At least 8 characters</li>
                            <li data-rule="upper">An uppercase letter</li>
                            <li data-rule="lower">A lowercase letter</li>
                            <li data-rule="num">A number</li>
                        </ul>
                    </div>

                    <div class="form-group">
                        <label for="suConfirm">Confirm Password</label>
                        <input type="password" id="suConfirm" placeholder="Re-enter password" required autocomplete="new-password">
                    </div>
                </div>

                <button type="submit" class="save-btn submit-full" id="signupBtn">Create Account</button>
            </form>
        </div>
    </div>

    <script>
        const $ = (id) => document.getElementById(id);
        const errorBox = $('loginError');
        const noticeBox = $('loginNotice');

        function showError(msg) {
            noticeBox.style.display = 'none';
            errorBox.textContent = msg;
            errorBox.style.display = 'block';
        }
        function showNotice(msg, type) {
            errorBox.style.display = 'none';
            noticeBox.textContent = msg;
            noticeBox.className = 'login-notice ' + (type || 'info');
            noticeBox.style.display = 'block';
        }
        function clearMessages() {
            errorBox.style.display = 'none';
            noticeBox.style.display = 'none';
        }

        function switchTab(which) {
            const isLogin = which === 'login';
            $('tabLogin').classList.toggle('active', isLogin);
            $('tabSignup').classList.toggle('active', !isLogin);
            $('loginForm').classList.toggle('hidden-form', !isLogin);
            $('signupForm').classList.toggle('hidden-form', isLogin);
            $('loginSubtitle').textContent = isLogin
                ? 'Sign in with an active staff or admin account'
                : 'Create a new account to request access';
            clearMessages();
        }
        $('tabLogin').addEventListener('click', () => switchTab('login'));
        $('tabSignup').addEventListener('click', () => switchTab('signup'));

        // Already signed in? Go straight to the dashboard.
        document.addEventListener('DOMContentLoaded', async () => {
            const reasons = {
                timeout:   ['You were signed out after 30 minutes of inactivity. Please sign in again.', 'info'],
                inactive:  ['Your account is inactive or waiting for administrator approval.', 'info'],
                denied:    ['Your account could not be verified. Please contact an administrator.', 'info'],
                loggedout: ['You have been signed out.', 'success']
            };
            const reason = new URLSearchParams(location.search).get('reason');
            if (reason && reasons[reason]) showNotice(reasons[reason][0], reasons[reason][1]);

            if (await Auth.hasActiveSession()) {
                window.location.replace('index.html');
            }
        });

        // ---- Sign in ----
        $('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            clearMessages();
            const btn = $('loginBtn');
            btn.disabled = true;
            btn.textContent = 'Signing in...';

            const result = await Auth.login($('username').value, $('password').value);

            btn.disabled = false;
            btn.textContent = 'Sign In';

            if (!result.ok) {
                showError(result.message);
                return;
            }
            window.location.href = 'index.html';
        });

        // ---- Live password rules ----
        $('suPassword').addEventListener('input', () => {
            const pw = $('suPassword').value;
            const checks = {
                len: pw.length >= 8,
                upper: /[A-Z]/.test(pw),
                lower: /[a-z]/.test(pw),
                num: /[0-9]/.test(pw)
            };
            document.querySelectorAll('#pwRules li').forEach(li => {
                li.classList.toggle('ok', checks[li.dataset.rule]);
            });
        });

        // ---- Create account ----
        $('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            clearMessages();
            const btn = $('signupBtn');
            btn.disabled = true;
            btn.textContent = 'Creating account...';

            const result = await Auth.signup({
                fullName: $('suFullName').value,
                username: $('suUsername').value,
                email: $('suEmail').value,
                password: $('suPassword').value,
                confirm: $('suConfirm').value
            });

            btn.disabled = false;
            btn.textContent = 'Create Account';

            if (!result.ok) {
                showError(result.message);
                return;
            }

            if (result.pending) {
                $('signupForm').reset();
                switchTab('login');
                showNotice(result.message, 'success');
                return;
            }

            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
