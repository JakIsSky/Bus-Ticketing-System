<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passenger Management | Bus Ticketing System</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-db.js"></script>
</head>
<body>
    <aside class="sidebar">
        <div class="logo">
            <span class="logo-icon">🚌</span>
            <h2>Bus Ticketing</h2>
        </div>
        <nav>
            <a href="index.html">▦ Dashboard</a>
            <a href="bus_management.html">🚌 Buses</a>
            <a href="route_management.html">⌖ Routes</a>
            <a href="schedule_management.html">▦ Schedules</a>
            <a href="passenger_management.html" class="active">♟ Passengers</a>
            <a href="booking.html">▤ Bookings</a>
            <a href="payment.html">▣ Payments</a>
            <a href="ticket.html">▤ Tickets</a>
            <a href="user.html">⚙ Users</a>
            <a href="report.html">▥ Reports</a>
        </nav>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <div>
                <h2>Passenger Management</h2>
                <p>Manage passenger records via Supabase.</p>
            </div>
        </header>

        <section class="content">
            <div class="page-heading">
                <h2>Passenger List</h2>
                <button class="add-btn" onclick="openPassengerForm()">+ Add New Passenger</button>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Passenger No.</th>
                            <th>Name</th>
                            <th>Contact</th>
                            <th>Email</th>
                            <th>Address</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="passengerTableBody"></tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- Passenger Form Modal -->
    <div class="modal" id="passengerModal" style="display:none;">
        <div class="modal-content">
            <h2 id="passengerFormTitle">Add Passenger</h2>
            <form id="passengerForm">
                <input type="hidden" id="passengerId">
                <input type="text" id="passengerNumber" placeholder="PSG-0001" required>
                <input type="text" id="firstName" placeholder="First Name" required>
                <input type="text" id="lastName" placeholder="Last Name" required>
                <input type="text" id="contactNumber" placeholder="Contact Number" required>
                <input type="email" id="email" placeholder="Email">
                <input type="text" id="address" placeholder="Address">
                <select id="passengerStatus">
                    <option value="Active">Active</option>
                    <option value="Inactive">Inactive</option>
                </select>
                <button type="button" onclick="closePassengerForm()">Cancel</button>
                <button type="submit">Save</button>
            </form>
        </div>
    </div>

    <script>
        let passengers = [];

        async function fetchPassengers() {
            passengers = await DB.getAll('passengers');
            renderPassengers();
        }

        function renderPassengers() {
            const tbody = document.getElementById("passengerTableBody");
            tbody.innerHTML = "";
            passengers.forEach(p => {
                const row = document.createElement("tr");
                row.innerHTML = `
                    <td>${p.passenger_id}</td>
                    <td>${p.passenger_number}</td>
                    <td>${p.first_name} ${p.last_name}</td>
                    <td>${p.contact_number}</td>
                    <td>${p.email || 'N/A'}</td>
                    <td>${p.address || 'N/A'}</td>
                    <td>${p.status}</td>
                    <td>
                        <button onclick="editPassenger(${p.passenger_id})">Edit</button>
                        <button onclick="deletePassenger(${p.passenger_id})">Delete</button>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        function openPassengerForm() {
            document.getElementById("passengerForm").reset();
            document.getElementById("passengerId").value = "";
            document.getElementById("passengerModal").style.display = "flex";
        }

        function closePassengerForm() {
            document.getElementById("passengerModal").style.display = "none";
        }

        document.getElementById("passengerForm").addEventListener("submit", async function(e) {
            e.preventDefault();
            const id = document.getElementById("passengerId").value;
            const payload = {
                passenger_number: document.getElementById("passengerNumber").value.trim(),
                first_name: document.getElementById("firstName").value.trim(),
                last_name: document.getElementById("lastName").value.trim(),
                contact_number: document.getElementById("contactNumber").value.trim(),
                email: document.getElementById("email").value.trim(),
                address: document.getElementById("address").value.trim(),
                status: document.getElementById("passengerStatus").value
            };

            if (id) {
                await DB.update('passengers', 'passenger_id', id, payload);
            } else {
                await DB.create('passengers', payload);
            }
            closePassengerForm();
            fetchPassengers();
        });

        function editPassenger(id) {
            const p = passengers.find(item => item.passenger_id === id);
            if (!p) return;
            document.getElementById("passengerId").value = p.passenger_id;
            document.getElementById("passengerNumber").value = p.passenger_number;
            document.getElementById("firstName").value = p.first_name;
            document.getElementById("lastName").value = p.last_name;
            document.getElementById("contactNumber").value = p.contact_number;
            document.getElementById("email").value = p.email || '';
            document.getElementById("address").value = p.address || '';
            document.getElementById("passengerStatus").value = p.status;
            document.getElementById("passengerModal").style.display = "flex";
        }

        async function deletePassenger(id) {
            if (confirm("Delete passenger?")) {
                await DB.delete('passengers', 'passenger_id', id);
                fetchPassengers();
            }
        }

        window.addEventListener('DOMContentLoaded', fetchPassengers);
    </script>
</body>
</html>
